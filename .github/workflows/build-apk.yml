name: Compilar APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Compilar APK debug
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew assembleDebug --console=plain 2>&1 | tee build.log

      # Si falla, los errores quedan visibles como anotaciones del build
      - name: Mostrar errores
        if: failure()
        run: |
          grep -E "^e: |What went wrong|error:" -A3 build.log | head -60 > errs.txt || true
          split -l 6 errs.txt part_ || true
          for f in part_*; do
            [ -f "$f" ] || continue
            msg=$(sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g' "$f")
            echo "::error::$msg"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: LiquidLock-v2-apk
          path: app/build/outputs/apk/debug/app-debug.apk
